[workspace]
resolver = "3"
members = ["crates/forgr-schema", "crates/forgr-macros", "crates/forgr"]
exclude = ["crates/forgr/tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rafters-studio/forgr"
rust-version = "1.89"

[workspace.dependencies]
forgr-schema = { path = "crates/forgr-schema", version = "0.1.0" }
forgr-macros = { path = "crates/forgr-macros", version = "0.1.0" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0.154"
fake = { version = "5.1", default-features = false }
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
rstest = "0.26"
rstest-bdd = "0.6"
rstest-bdd-macros = "0.6"
