[workspace]
resolver = "3"
members = ["crates/forgr-schema", "crates/forgr-macros", "crates/forgr"]
exclude = ["crates/forgr/tests/fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0.154"
fake = { version = "5.1", default-features = false }
rstest = "0.26"
rstest-bdd = "0.6"
rstest-bdd-macros = "0.6"
