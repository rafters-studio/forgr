[package]
name = "forgr"
edition.workspace = true
rust-version.workspace = true

[dependencies]
forgr-macros = { path = "../forgr-macros" }
forgr-schema = { path = "../forgr-schema" }
rusqlite = { workspace = true }
fake = { workspace = true, optional = true }
# The SQL check: reads the workspace's source at test time.
syn = { workspace = true }
# Line numbers of what syn reads, outside a proc macro.
proc-macro2 = { workspace = true }
# The members `cargo metadata` lists.
serde_json = { workspace = true }

[features]
# Mocks: the generator, and schema! emitting each table's mock.
fake = ["dep:fake", "forgr-macros/fake"]

[dev-dependencies]
# forgr's own scenarios are built with fake.
forgr = { path = ".", features = ["fake"] }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
